# ============================================================
# application.yml
# COMMON configuration -- loaded for ALL profiles
# Profile-specific files OVERRIDE values defined here
#
# Active profile set via:
#   IntelliJ: VM options: -Dspring.profiles.active=dev
#   Command line: java -jar app.jar --spring.profiles.active=prod
#   Environment variable: SPRING_PROFILES_ACTIVE=prod
# ============================================================

server:
  port: 8080

spring:
  profiles:
    default: prod                       # Set default active profile in application.yml

  application:
    name: order-management-service    # spring.application.name

  # ---- Jackson (HttpMessageConverter config) ----
  # Common for all profiles
  #jackson:
  #  serialization:
  #    write-dates-as-timestamps: false    # "2026-05-06" not [2026,5,6]
  #  deserialization:
  #    fail-on-unknown-properties: false   # ignore extra fields from client
#    default-property-inclusion: NON_NULL  # skip null fields in response

# ---- Actuator ----
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

# ============================================================
# Custom Application Properties
# Bound via @ConfigurationProperties(prefix = "app")
# Common defaults -- overridden per profile if needed
# ============================================================
app:

  order:
    max-page-size: 50               # max allowed page size in pagination
    default-page-size: 10           # default page size
    allowed-sort-fields: id,createdAt,price,status  # whitelist for sort
    min-order-value: 100.0          # minimum order total value

  async:
    core-pool-size: 5               # ThreadPoolTaskExecutor core threads
    max-pool-size: 20               # max threads
    queue-capacity: 100             # queue before spawning beyond core
    thread-name-prefix: order-async-

  notification:
    email-enabled: true
    retry-attempts: 3